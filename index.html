<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Message for Tikku 💕</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #ffe6f0, #e8f4f8);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 350px;
      width: 90%;
    }
    img {
      width: 180px;
      border-radius: 15px;
      animation: bounce 2s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 { color: #ff4d6d; font-size: 24px; margin-top: 15px; }
    p { color: #555; font-size: 18px; line-height: 1.5; }
    .btn {
      background: #ff4d6d;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://i.postimg.cc/0jXnZ3sK/panda.png" alt="Teddy Bear">
    <h1>I Miss You Tikku! 💖</h1>
    <p id="msg">Ummah! 💋 <br> 🌻 Yeh sunflower aapke liye!</p>
    <p><b>I miss you, jaldi aajao! 🥺❤️</b></p>
  </div>
</body>
</html>
